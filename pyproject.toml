[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "rpi-mcp-controller"
version = "0.1.0"
description = "A local MCP server for securely operating Raspberry Pis over SSH"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=2.1,<3",
    "platformdirs>=4",
    "python-dotenv>=1.0",
]

[project.scripts]
rpi-mcp = "rpi_mcp.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rpi_mcp = ["templates/*.env"]